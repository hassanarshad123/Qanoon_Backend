# QanoonAI FastAPI backend — Nginx reverse proxy (Cloudflare Proxied)
# Place at: /etc/nginx/sites-available/qanoonai
# Symlink:  ln -s /etc/nginx/sites-available/qanoonai /etc/nginx/sites-enabled/
#
# SSL mode: Cloudflare Full (Strict) with Origin Certificate
# Generate at: Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;

# Upstream — gunicorn on localhost
upstream qanoonai_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ------------------------------------------------------------------
# Cloudflare trusted IPs — restore real visitor IP from CF-Connecting-IP
# Source: https://www.cloudflare.com/ips/
# Update periodically: curl https://www.cloudflare.com/ips-v4 ; curl https://www.cloudflare.com/ips-v6
# ------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.zensbots.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zensbots.site;

    # ------------------------------------------------------------------
    # SSL — Cloudflare Origin Certificate
    # Generate at: Cloudflare Dashboard → api.zensbots.site →
    #   SSL/TLS → Origin Server → Create Certificate
    # Save the cert and key to these paths on EC2:
    # ------------------------------------------------------------------
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Max upload size (for document uploads)
    # ------------------------------------------------------------------
    client_max_body_size 25m;

    # ------------------------------------------------------------------
    # Gzip compression for JSON API responses
    # ------------------------------------------------------------------
    gzip on;
    gzip_types application/json text/plain text/event-stream;
    gzip_min_length 256;

    # ------------------------------------------------------------------
    # Rate-limited auth endpoints (10 req/s per IP, burst 20)
    # ------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=20 nodelay;

        proxy_pass http://qanoonai_backend;
        include /etc/nginx/proxy_params;
    }

    # ------------------------------------------------------------------
    # SSE streaming endpoints — disable buffering so tokens stream
    # immediately to the client instead of being batched by nginx
    # ------------------------------------------------------------------
    location ~ ^/api/v1/(briefs|judgments|research)/.*/(generate|stream) {
        proxy_pass http://qanoonai_backend;
        include /etc/nginx/proxy_params;

        # CRITICAL for SSE: disable all buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # AI streams can run 30-120+ seconds
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------------------------
    # All other API endpoints (30 req/s per IP)
    # ------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://qanoonai_backend;
        include /etc/nginx/proxy_params;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Block everything else
    location / {
        return 404;
    }

    # ------------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------------
    access_log /var/log/nginx/qanoonai_access.log;
    error_log  /var/log/nginx/qanoonai_error.log;
}
